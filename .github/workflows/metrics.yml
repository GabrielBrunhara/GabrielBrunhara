name: GitHub Metrics

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate overview metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_LOGIN: GabrielBrunhara
        run: node .github/scripts/generate-overview-card.mjs

      - name: Commit overview metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics/overview.svg

          if git diff --cached --quiet; then
            echo "No metric changes to commit"
          else
            git commit -m "chore: update metrics overview [skip ci]"
            git push
          fi
