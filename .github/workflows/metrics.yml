name: GitHub Metrics

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/profile.svg
          user: GabrielBrunhara
          template: classic
          base: header, activity, community, metadata
          base_indepth: yes
          repositories: 200
          repositories_forks: yes
          repositories_affiliations: ""
          commits_authoring: GabrielBrunhara, Gabriel Brunhara, gabrielbrunhara02@gmail.com
          config_timezone: America/Sao_Paulo
          config_padding: 0, 8 + 2%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Checkout latest repository state
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync generated profile metrics
        run: git pull --ff-only origin main

      - name: Generate language metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_LOGIN: GabrielBrunhara
        run: node .github/scripts/generate-language-card.mjs

      - name: Commit language metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics/languages.svg

          if git diff --cached --quiet; then
            echo "No language metric changes to commit"
          else
            git commit -m "Update metrics/languages.svg - [Skip GitHub Action]"
            git push
          fi
