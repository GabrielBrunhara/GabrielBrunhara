name: GitHub Metrics

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/profile.svg
          user: GabrielBrunhara
          template: classic
          base: header, activity, community, metadata
          base_indepth: yes
          repositories: 200
          repositories_forks: yes
          repositories_affiliations: ""
          commits_authoring: GabrielBrunhara, Gabriel Brunhara, gabrielbrunhara02@gmail.com
          config_timezone: America/Sao_Paulo
          config_padding: 0, 8 + 2%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          user: GabrielBrunhara
          template: classic
          base: ""
          repositories: 200
          repositories_forks: yes
          repositories_affiliations: ""
          commits_authoring: GabrielBrunhara, Gabriel Brunhara, gabrielbrunhara02@gmail.com
          config_timezone: America/Sao_Paulo
          config_padding: 0, 8 + 2%

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
