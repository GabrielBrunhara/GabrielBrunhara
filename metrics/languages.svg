<svg xmlns="http://www.w3.org/2000/svg" width="480" height="194" viewBox="0 0 480 194" role="img" aria-labelledby="title desc">
  <title id="title">GitHub language metrics</title>
  <desc id="desc">Most used languages across contributed repositories</desc>
  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0D1117;
    }

    .title {
      fill: #22D3EE;
      font-size: 18px;
      font-weight: 600;
    }

    .subtitle,
    .muted {
      fill: #8B949E;
      font-size: 12px;
    }

    .language {
      fill: #C9D1D9;
      font-size: 13px;
      font-weight: 500;
    }
  </style>

  <rect width="100%" height="100%" rx="0" fill="#0D1117" />
  <text x="24" y="32" class="title">Top 8 of 21 Languages</text>
  <text x="24" y="52" class="subtitle">60 contributed repositories · 56.4 MB analyzed</text>

  <clipPath id="language-bar">
    <rect x="24" y="70" width="432" height="10" rx="5" />
  </clipPath>

  <g clip-path="url(#language-bar)">
      <rect x="24.00" y="70" width="160.05" height="10" fill="#3178c6" />
      <rect x="184.05" y="70" width="100.93" height="10" fill="#4F5D95" />
      <rect x="284.98" y="70" width="48.91" height="10" fill="#178600" />
      <rect x="333.89" y="70" width="47.46" height="10" fill="#f1e05a" />
      <rect x="381.35" y="70" width="29.83" height="10" fill="#336790" />
      <rect x="411.18" y="70" width="26.86" height="10" fill="#b07219" />
      <rect x="438.05" y="70" width="6.63" height="10" fill="#f7523f" />
      <rect x="444.68" y="70" width="11.32" height="10" fill="#4A2CC5" />
  </g>


