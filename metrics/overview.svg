<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="320" viewBox="0 0 1240 320" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity and language metrics</title>
  <desc id="desc">Aggregated GitHub contribution and language metrics for Gabriel Brunhara</desc>
  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0D1117;
    }

    .title {
      fill: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
    }

    .section {
      fill: #22D3EE;
      font-size: 18px;
      font-weight: 700;
    }

    .muted {
      fill: #8B949E;
      font-size: 13px;
    }

    .label {
      fill: #C9D1D9;
      font-size: 14px;
      font-weight: 500;
    }

    .value {
      fill: #FFFFFF;
      font-size: 14px;
      font-weight: 650;
    }

    .stat-value {
      fill: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
    }
  </style>

  <rect width="1240" height="320" rx="0" fill="#0D1117" />
  <rect x="0" y="0" width="1240" height="2" fill="#22D3EE" opacity="0.9" />
  <rect x="0" y="2" width="1240" height="2" fill="#4A2CC5" opacity="0.85" />

  <text x="32" y="48" class="title">GitHub activity</text>
  <text x="650" y="48" class="title">Languages</text>
  <line x1="604" y1="32" x2="604" y2="284" stroke="#30363D" />

  
    <g transform="translate(32 98)">
      <text class="stat-value" x="0" y="0">1,120</text>
      <text class="muted" x="0" y="20">contributions this year</text>
    </g>
  
    <g transform="translate(210 98)">
      <text class="stat-value" x="0" y="0">229</text>
      <text class="muted" x="0" y="20">private contributions</text>
    </g>
  
    <g transform="translate(388 98)">
      <text class="stat-value" x="0" y="0">70</text>
      <text class="muted" x="0" y="20">contributed repos</text>
    </g>

  
    <g transform="translate(32 154)">
      <circle cx="0" cy="-5" r="4" fill="#22D3EE" opacity="0.9" />
      <text class="label" x="14" y="0">Public commits</text>
      <text class="value" x="230" y="0" text-anchor="end">891</text>
    </g>
  
    <g transform="translate(32 184)">
      <circle cx="0" cy="-5" r="4" fill="#22D3EE" opacity="0.9" />
      <text class="label" x="14" y="0">Searchable commits</text>
      <text class="value" x="230" y="0" text-anchor="end">755</text>
    </g>
  
    <g transform="translate(32 214)">
      <circle cx="0" cy="-5" r="4" fill="#22D3EE" opacity="0.9" />
      <text class="label" x="14" y="0">Pull requests opened</text>
      <text class="value" x="230" y="0" text-anchor="end">309</text>
    </g>
  
    <g transform="translate(32 244)">
      <circle cx="0" cy="-5" r="4" fill="#22D3EE" opacity="0.9" />
      <text class="label" x="14" y="0">Pull requests reviewed</text>
      <text class="value" x="230" y="0" text-anchor="end">14</text>
    </g>
  
    <g transform="translate(32 274)">
      <circle cx="0" cy="-5" r="4" fill="#22D3EE" opacity="0.9" />
      <text class="label" x="14" y="0">Organizations</text>
      <text class="value" x="230" y="0" text-anchor="end">3</text>
    </g>

  <text x="650" y="88" class="section">Top 8 of 21</text>
  <text x="650" y="110" class="muted">70 contributed repositories · 61.2 MB analyzed</text>

  <clipPath id="language-bar">
    <rect x="650" y="132" width="520" height="10" rx="5" />
  </clipPath>
  <g clip-path="url(#language-bar)">
    <rect x="650.00" y="132" width="203.01" height="10" fill="#3178c6" /><rect x="853.01" y="132" width="122.88" height="10" fill="#4F5D95" /><rect x="975.89" y="132" width="54.28" height="10" fill="#178600" /><rect x="1030.17" y="132" width="52.89" height="10" fill="#f1e05a" /><rect x="1083.06" y="132" width="33.11" height="10" fill="#336790" /><rect x="1116.17" y="132" width="31.79" height="10" fill="#b07219" /><rect x="1147.96" y="132" width="8.09" height="10" fill="#3572A5" /><rect x="1156.05" y="132" width="13.95" height="10" fill="#4A2CC5" />
  </g>

  
