        <text x="1064" y="210" class="muted" text-anchor="end">11.0%</text>
        <circle cx="650" cy="231" r="5" fill="#336790" />
        <text x="666" y="236" class="label">PLpgSQL</text>
        <text x="824" y="236" class="muted" text-anchor="end">6.9%</text>
        <circle cx="890" cy="231" r="5" fill="#b07219" />
        <text x="906" y="236" class="label">Java</text>
        <text x="1064" y="236" class="muted" text-anchor="end">6.2%</text>
        <circle cx="650" cy="257" r="5" fill="#f7523f" />
        <text x="666" y="262" class="label">Blade</text>
        <text x="824" y="262" class="muted" text-anchor="end">1.5%</text>
        <circle cx="890" cy="257" r="5" fill="#4A2CC5" />
