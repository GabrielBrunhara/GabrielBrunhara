        <text x="824" y="236" class="muted" text-anchor="end">6.0%</text>
        <circle cx="890" cy="231" r="5" fill="#3572A5" />
        <text x="906" y="236" class="label">Python</text>
        <text x="1064" y="236" class="muted" text-anchor="end">2.7%</text>
        <circle cx="650" cy="257" r="5" fill="#844FBA" />
